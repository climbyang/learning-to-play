[project]
name = "learning-to-play"
version = "0.2.0"
description = "Home TV learning/entertainment control: LG webOS monitor, daily quota, Telegram notifications"
requires-python = ">=3.11"
dependencies = [
    "bscpylgtv>=0.5.5,<0.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2026.6",
    "starlette>=0.37,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
ltp = "ltp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
